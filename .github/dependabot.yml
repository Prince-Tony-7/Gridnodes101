# Keeps dependencies and GitHub Actions patched. Opens at most one grouped
# pull request per ecosystem each month; security fixes arrive as soon as they're published.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      all-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      all-actions:
        patterns: ["*"]
